services:
  backend:
    build:
      context: ./backend
    container_name: cloudpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro

  frontend:
    build:
      context: ./frontend
    container_name: cloudpulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend