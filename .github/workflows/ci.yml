name: CloudPulse CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0ad789def877cc2ad
  AWS_ROLE_ARN: arn:aws:iam::001606112020:role/cloudpulse-github-actions

jobs:

  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate FastAPI
        working-directory: backend
        run: |
          python -m py_compile main.py


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # ==========================================================
  # DOCKER
  # ==========================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t cloudpulse-backend:ci \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t cloudpulse-frontend:ci \
            ./frontend


  # ==========================================================
  # DEPLOY TO AWS EC2
  # ==========================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudPulse to EC2
        id: deploy
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudPulse GitHub Actions deployment ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "export DEBIAN_FRONTEND=noninteractive",
              "apt-get update -y",
              "apt-get install -y git docker.io docker-compose-v2",
              "systemctl enable docker",
              "systemctl start docker",
              "mkdir -p /opt/cloudpulse-repo",
              "if [ ! -d /opt/cloudpulse-repo/.git ]; then git clone https://github.com/itzkhanoffcl/cloudpulse.git /opt/cloudpulse-repo; else cd /opt/cloudpulse-repo && git fetch origin && git reset --hard origin/main; fi",
              "cd /opt/cloudpulse-repo",
              "docker compose down || true",
              "docker compose up -d --build",
              "docker image prune -f",
              "docker compose ps"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          echo "Waiting for EC2 deployment..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "CloudPulse deployment successful."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "CloudPulse deployment failed."
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 10

          done

          echo "Deployment timed out."
          exit 1


      # ======================================================
      # HEALTH CHECK
      # ======================================================

      - name: Verify EC2
        run: |

          aws ec2 describe-instance-status \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --include-all-instances \
            --query 'InstanceStatuses[0].InstanceState.Name' \
            --output text

      - name: Deployment Complete
        run: |
          echo "=========================================="
          echo " CloudPulse Deployment Successful"
          echo "=========================================="
          echo "Commit: ${GITHUB_SHA}"
          echo "EC2: ${EC2_INSTANCE_ID}"
          echo "Region: ${AWS_REGION}"
          echo "=========================================="
